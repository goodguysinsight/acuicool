<style>
:root{--bg:#f7f8f6;--card:#fff;--ink:#14231f;--mut:#5b6b66;--line:#dde4e1;--acc:#0b5c5c;--acc2:#c2410c;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1715;--card:#16211e;--ink:#e8efec;--mut:#9fb0aa;--line:#2a3a36;--acc:#5fb5a5;--acc2:#fb923c}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:1200;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;margin-right:auto}.brand h1{font-size:20px}.brand p{margin:0;font-size:12px;color:var(--mut)}
.logo{width:40px;height:40px;border-radius:8px;display:block;object-fit:cover}
.tabs{display:flex;gap:4px}.tabs button{border:0;background:none;padding:8px 14px;border-radius:8px;font:inherit;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}.tabs button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}.btn.ghost{display:none}.btn.sm{padding:4px 8px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:16px;padding:16px 20px;align-items:start}
#filters,#panel,.card,.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
#filters{padding:14px;position:sticky;top:70px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 90px);overflow:auto}
.fhead{display:flex;justify-content:space-between;align-items:center}.fhead .btn{display:none}.fhead h2{font-size:16px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}.g{display:flex;flex-direction:column;gap:10px}
select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;width:100%}
.hint{font-size:12px;color:var(--mut);margin:0}
main{min-width:0;display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{padding:10px 12px}.kpi small{color:var(--mut);font-size:12px}.kpi b{display:block;font:600 22px Georgia,serif}.kpi span{font-size:12px;color:var(--mut)}
.banner{padding:8px 12px;border-radius:8px;background:#fef3c7;color:#78350f;font-size:13px;border:1px solid #fde68a}.banner.warn{background:#fee2e2;color:#7f1d1d;border-color:#fecaca}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#eef3f1}
#map{height:min(66vh,640px);min-height:340px;background:#eef3f1}
.legend{position:absolute;left:10px;bottom:10px;z-index:500;background:rgba(255,255,255,.94);color:#14231f;padding:8px 10px;border-radius:8px;font-size:12px;box-shadow:0 1px 4px #0003;max-width:70%}
.legend i{display:inline-block;width:16px;height:10px;margin-right:6px;border:1px solid #0002}.legend div{white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.card{padding:12px;min-width:0}.card h3{font-size:15px}.card .sub{margin:2px 0 8px;font-size:12px;color:var(--mut)}
.cv{position:relative;height:250px;min-width:0}
#panel{padding:14px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;min-width:0}
#panel h2{font-size:20px}#panel .row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}#panel table{width:100%;border-collapse:collapse;font-size:13px}#panel td,#panel th{padding:4px 2px;border-bottom:1px solid var(--line);text-align:right}#panel td:first-child,#panel th:first-child{text-align:left}
.pv{height:190px;position:relative;margin:8px 0}
footer{padding:16px 20px 28px;font-size:12px;color:var(--mut);max-width:1200px}footer p{margin:4px 0}
.leaflet-container{font:inherit}.tt b{display:block}
@media (max-width:1100px){.app{grid-template-columns:minmax(0,1fr)}#panel{position:static;max-height:none}.btn.ghost{display:inline-block}
 #filters{position:fixed;inset:0 auto 0 0;width:min(86vw,330px);max-height:none;z-index:2000;transform:translateX(-105%);transition:transform .2s;border-radius:0}#filters.open{transform:none;box-shadow:0 0 0 100vmax #0006}.fhead .btn{display:inline-block}}
@media (max-width:640px){.top{padding:8px 12px}.brand p{display:none}.tabs{order:3;width:100%}.tabs button{flex:1;padding:8px 4px;font-size:13px}.app{padding:10px 12px}#map{height:58vh;min-height:320px}.cv{height:230px}.legend{max-width:90%;font-size:11px}}

</style>
</head>

  if(!GEO){$('#geowarn').hidden=false;$('#geowarn').textContent='No se pudieron cargar los límites departamentales (GeoJSON). Descarga data/peru_departamental.geojson siguiendo el README. Mientras tanto, rankings, gráficos y filtros siguen funcionando; selecciona un departamento con el buscador.';$('#map').style.display='none';$('#legend').style.display='none';return}
  map=L.map('map',{zoomSnap:.25,attributionControl:true,minZoom:4});
  map.attributionControl.addAttribution('Límites: INEI 2007 vía MINAM/GEOIDEP (GeoJSON simplificado: juaneladio/peru-geojson)');
  layer=L.geoJSON(GEO,{style:styleF,onEachFeature:(f,l)=>{const n=gname(f);l.bindTooltip(()=>tip(n),{sticky:true,className:'tt'});l.on('click',()=>pick(depName(n)));}}).addTo(map);
  map.fitBounds(layer.getBounds());window.addEventListener('resize',()=>map.invalidateSize());
  const un=GEO.features.map(gname).filter(n=>!DX.has(n));if(un.length)console.warn('Entidades del GeoJSON sin datos:',un);
}
const depName=n=>{const i=depIdx(n);return i==null?null:DEP[i]};
function valueOf(n){const i=depIdx(n);if(i==null)return null;return S.tab==='derechos'?(()=>{const r=dget(S.cut,S.cat,DEP[i]);return r?r[S.v]:null})():(VAL.has(i)?VAL.get(i):null)}
const styleF=f=>{const n=gname(f),on=S.sel&&norm(S.sel)===n,c=S.cmp.some(x=>norm(x)===n);return{fillColor:colorOf(valueOf(n)),weight:on?3:c?2.5:.8,color:on?'#c2410c':c?'#4f46e5':'#5b6b66',fillOpacity:.92}};
const unit=()=>S.tab==='derechos'?['','','ha'][S.v]:IND[S.ind].u;
const fmtV=v=>v==null?'sin dato':nf(v,S.tab==='derechos'&&S.v<2?0:S.v==2&&S.tab==='derechos'?1:(v<10?2:0))+' '+unit();
function tip(n){const i=depIdx(n),v=valueOf(n),tot=[...allVals()].reduce((a,b)=>a+b,0);let t=`<b>${cap(n)}</b>${fmtV(v)}`;if(v!=null&&tot>0&&!(S.tab==='derechos'&&S.v===0))t+=`<br>${nf(v/tot*100,1)}% del total nacional`;if(v==null)t+='<br>Sin registros para esta selección (no equivale a cero)';return t}
function allVals(){const out=[];if(S.tab==='derechos'){for(const d of DEP){const r=dget(S.cut,S.cat,d);if(r)out.push(r[S.v])}}else VAL.forEach(v=>out.push(v));return out}
function legend(){const el=$('#legend');const t=S.tab==='derechos'?`${VARS[S.v]}${S.v==2?' (ha)':''}`:`${IND[S.ind].n} (${IND[S.ind].u})`;let lo=0,h=`<b>${t}</b>`;BR.forEach((b,i)=>{h+=`<div><i style="background:${PAL[PAL.length-BR.length+i]}"></i>${nf(lo,lo<10?1:0)} – ${nf(b,b<10?1:0)}</div>`;lo=b});h+=`<div><i style="background:#f6f8f8"></i>0 registrado</div><div><i style="background:#d1d5db"></i>Sin dato</div><div style="opacity:.7">Cortes por quintiles</div>`;el.innerHTML=h}
function pick(name,zoom){S.sel=name;renderKpis();renderPanel();layer&&layer.setStyle(styleF);if(zoom&&layer)layer.eachLayer(l=>{if(gname(l.feature)===norm(name))map.fitBounds(l.getBounds(),{maxZoom:7})});if(window.innerWidth<=1100)$('#panel').scrollIntoView({behavior:'smooth'})}
// ---------- render ----------
function render(){
  document.querySelectorAll('#filters .g').forEach(g=>g.hidden=!g.dataset.t.split(' ').includes(S.tab));
  $('#mapwrap').style.display=S.tab==='mercado'?'none':'';$('#panel').style.display=S.tab==='mercado'?'none':'';
  document.querySelector('.app').style.gridTemplateColumns=window.innerWidth>1100?(S.tab==='mercado'?'250px minmax(0,1fr)':''):'';
  $('#f-cat').disabled=S.tab==='derechos'&&S.cut!=='2026';$('#catHint').textContent=S.cut!=='2026'?'Las categorías productivas solo existen para el corte de agosto 2026.':'Un acuicultor puede tener derechos en más de una categoría: no sumes acuicultores entre categorías.';
  $('#indNote').textContent=S.tab==='mapa'?IND[S.ind].note:'';
  const part=(S.tab!=='derechos')&&(S.y===''||S.y==LASTY);$('#partial').hidden=!part;$('#partial').textContent='2026 es un período parcial (enero–agosto) y con cifras preliminares sujetas a reajuste. No lo compares con años completos.';
  if(S.tab==='mapa'){VAL=byDep(S.ind);BR=breaks([...VAL.values()])}else if(S.tab==='derechos')BR=breaks(allVals());
  if(!initDone&&S.tab!=='mercado'){initDone=true;initMap()}
  if(S.tab==='mercado')renderMarket();else{renderKpis();renderCards();legend();layer&&layer.setStyle(styleF);renderPanel()}
  renderFoot();
}
const per=()=>(S.m?MES[S.m-1]+' ':'')+(S.y?S.y+(S.y==LASTY?' (parcial)':''):'2015–2026');
function renderKpis(){
  let k=[];const n=S.sel,i=n!=null?depIdx(n):null,nm=n?cap(n):'';
  if(S.tab==='mapa'){
    const arr=[...VAL].sort((a,b)=>b[1]-a[1]),tot=arr.reduce((a,b)=>a+b[1],0),u=IND[S.ind].u,pr=per();
    if(i!=null){const v=VAL.get(i),rk=arr.findIndex(x=>x[0]===i)+1,m=new Map();
      for(const r of D[S.ind])if(r[2]===i&&okR(r,S.ind))m.set(r[3],(m.get(r[3])||0)+r[6]);
      const t=[...m].sort((a,b)=>b[1]-a[1])[0];
      k=[[IND[S.ind].n+' · '+nm,v==null?'sin registros':nf(v,v<10?2:0)+' '+u,pr],['% del total nacional',v==null?'s/d':nf(v/tot*100,1)+'%','nacional: '+nf(tot)+' '+u],['Puesto nacional',v==null?'s/d':rk+' de '+arr.length,'entre departamentos con registro'],['Especie principal',t?cap(D.dims.esp[t[0]]):'s/d',t?nf(t[1]/v*100,1)+'% de '+nm:pr]];
    }else{const t3=arr.slice(0,3).reduce((a,b)=>a+b[1],0);
      k=[['Total '+IND[S.ind].n.toLowerCase()+' · Perú',nf(tot,0)+' '+u,pr],['Departamentos con registro',arr.length+' de '+DEP.length,'los demás: sin registros'],['Mayor concentración',arr[0]?cap(DEP[arr[0][0]]):'s/d',arr[0]?nf(arr[0][1]/tot*100,1)+'% del total':''],['Top 3 departamentos',tot?nf(t3/tot*100,1)+'%':'s/d','participación conjunta']];}
  }else{
    const g=d=>dget(S.cut,S.cat,d),rows=DEP.map(g).filter(Boolean),sum=j=>rows.reduce((a,r)=>a+r[j],0),cs=S.cat?'categoría '+S.cat:'total general',cl='corte '+S.cut;
    if(i!=null){const r=g(DEP[i]),pc=j=>r&&sum(j)?nf(r[j]/sum(j)*100,1)+'% del nacional':'';
      const rk=r?DEP.map(g).filter(Boolean).map(x=>x[S.v]).sort((a,b)=>b-a).indexOf(r[S.v])+1:0;
      k=[['Acuicultores · '+nm,r?nf(r[0]):'s/d',r?pc(0):'sin registro en el corte'],['Derechos otorgados',r?nf(r[1]):'s/d',r?pc(1):cl],['Hectáreas',r?nf(r[2],1):'s/d',r?pc(2):cl],['Puesto en '+VARS[S.v].toLowerCase(),r?rk+' de '+rows.length:'s/d',cs+' · '+cl]];
    }else k=[['Acuicultores',nf(sum(0)),S.cat?'solo categoría '+S.cat:'suma de departamentos'],['Derechos otorgados',nf(sum(1)),cs+' · '+cl],['Hectáreas',nf(sum(2),1),'ha según catastro'],['Departamentos con derechos',rows.filter(r=>r[1]>0).length+' de '+DEP.length,'derechos > 0']];
  }
  $('#kpis').innerHTML=k.map(x=>`<div class="kpi"><small>${x[0]}</small><b>${x[1]}</b><span>${x[2]}</span></div>`).join('')
}
function renderCards(){
  if(S.tab==='mapa'){
    const top=[...VAL].sort((a,b)=>b[1]-a[1]).slice(0,10).map(([i,v])=>[cap(DEP[i]),v]);
    $('#cards').innerHTML=card('c1','Ranking por departamento (top 10)','Clic en una barra para ver el detalle · '+IND[S.ind].u)+card('c2',S.cmp.length?'Comparación de tendencia':'Tendencia nacional anual','2026* = enero–agosto (línea punteada) · '+IND[S.ind].u+(S.cmp.length?' · quitar con «Comparar» en el panel':''))+card('c3','Composición por especie','Filtros activos · '+IND[S.ind].u);
    hbar('c1',top,IND[S.ind].n,v=>nf(v)+' '+IND[S.ind].u,n=>pick(depName(n)));
    const labels=YEARS.map(y=>y==LASTY?y+'*':y),ds=S.cmp.length?S.cmp.map((d,i)=>({label:cap(d),data:annual(S.ind,depIdx(d)),borderColor:LINES[i],backgroundColor:LINES[i],tension:.2,spanGaps:false,segment:{borderDash:dash}})):[{label:'Perú',data:annual(S.ind),borderColor:LINES[0],backgroundColor:LINES[0],tension:.2,segment:{borderDash:dash}}];
    chart('c2',{type:'line',data:{labels,datasets:ds},options:{plugins:{legend:{display:ds.length>1}},scales:{y:{beginAtZero:true,ticks:{callback:v=>nf(v)}}}}});
    hbar('c3',groupBy(S.ind,3,6).slice(0,8).map(([i,v])=>[cap(D.dims.esp[i]),v]),'TM',v=>nf(v)+' TM');
  }else{
    const rows=DEP.map(d=>[cap(d),(dget(S.cut,S.cat,d)||[])[S.v]]).filter(r=>r[1]!=null).sort((a,b)=>b[1]-a[1]).slice(0,10),dd=S.sel;
    $('#cards').innerHTML=card('c1','Ranking por departamento (top 10)',VARS[S.v]+' · '+(S.cat||'total general')+' · corte '+S.cut)+card('c2','Comparación de cortes',(dd?cap(dd):'Total nacional (suma de departamentos)')+' · '+VARS[S.v]+' · cortes con fechas distintas')+card('c3','Categorías productivas · agosto 2026',(dd?cap(dd):'Total nacional')+' · '+VARS[S.v]+' · sin sumar acuicultores entre categorías');
    hbar('c1',rows,VARS[S.v],v=>nf(v,S.v==2?1:0),n=>pick(depName(n)));
    const val=c=>{const o=c==='cat'?null:D.der[c];const rs=dd?[dget(c,'',dd)].filter(Boolean):DEP.map(d=>dget(c,'',d)).filter(Boolean);return rs.length?rs.reduce((a,r)=>a+r[S.v],0):null};
    chart('c2',{type:'bar',data:{labels:['Al 2024','Al 2025 (corte feb-26)','Ago 2026 (corte oct-26)'],datasets:[{data:['2024','2025','2026'].map(val),backgroundColor:['#a6d8cc','#5fb5a5','#0b5c5c']}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
    chart('c3',{type:'bar',data:{labels:Object.keys(CATS),datasets:[{data:Object.keys(CATS).map(c=>{const rs=dd?[dget('2026',c,dd)].filter(Boolean):DEP.map(d=>dget('2026',c,d)).filter(Boolean);return rs.reduce((a,r)=>a+r[S.v],0)}),backgroundColor:'#2a8a80'}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
  }
}
function renderPanel(){
  const p=$('#panel'),n=S.sel;
  if(!n){p.innerHTML='<h2>Detalle territorial</h2><p class="hint">Haz clic en un departamento del mapa (o usa el buscador) para ver sus indicadores, tendencia y especies. Usa «Comparar» para contrastar hasta 4 departamentos.</p>';return}
  const i=depIdx(n),cmp=S.cmp.some(x=>norm(x)===norm(n)),head=`<h2>${cap(n)}</h2><div class="row"><button class="btn sm" id="pc">${cmp?'Quitar de comparación':'Comparar'}</button><button class="btn sm" id="px">Cerrar</button></div>`;let b='';
  if(S.tab==='derechos'){
    const rows=['2024','2025','2026'].map(c=>{const r=dget(c,'',n);return`<tr><td>${c==='2026'?'Ago 2026':c==='2025'?'2025':'2024'}</td>${r?r.map((v,j)=>`<td>${nf(v,j==2?1:0)}</td>`).join(''):'<td colspan=3>s/d</td>'}</tr>`}).join('');
    const cr=Object.keys(CATS).map(c=>{const r=dget('2026',c,n);return`<tr><td>${c}</td>${r?r.map((v,j)=>`<td>${nf(v,j==2?1:0)}</td>`).join(''):'<td colspan=3>s/d</td>'}</tr>`}).join('');
    b=`<table><tr><th>Corte</th><th>Acuic.</th><th>Derechos</th><th>Ha</th></tr>${rows}</table><p class="hint">Los cortes tienen fechas y fuentes distintas; las diferencias no son necesariamente crecimiento.</p><table><tr><th>Cat. 2026</th><th>Acuic.</th><th>Derechos</th><th>Ha</th></tr>${cr}</table>`;
  }else{
    const v=VAL.get(i),tot=[...VAL.values()].reduce((a,c)=>a+c,0),rk=[...VAL].sort((a,c)=>c[1]-a[1]).findIndex(x=>x[0]===i)+1;
    b=v==null?`<p class="hint">Sin registros de ${IND[S.ind].n.toLowerCase()} para esta combinación de filtros. Esto no significa cero.</p>`:`<div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><small>${IND[S.ind].n}</small><b>${nf(v,v<10?2:0)}</b><span>${IND[S.ind].u}</span></div><div class="kpi"><small>Participación / puesto</small><b>${nf(v/tot*100,1)}%</b><span>puesto ${rk} de ${VAL.size}</span></div></div>`;
    b+=`<h3 style="font-size:14px">Tendencia anual (${IND[S.ind].u})</h3><div class="pv"><canvas id="pc1"></canvas></div><h3 style="font-size:14px">Especies principales</h3><div class="pv"><canvas id="pc2"></canvas></div>`;
  }
  p.innerHTML=head+b;
  $('#pc').onclick=()=>{S.cmp=cmp?S.cmp.filter(x=>norm(x)!==norm(n)):[...S.cmp,n].slice(-4);render()};$('#px').onclick=()=>{S.sel=null;renderKpis();renderPanel();layer&&layer.setStyle(styleF)};
  if(S.tab!=='derechos'){chart('pc1',{type:'line',data:{labels:YEARS.map(y=>y==LASTY?y+'*':y),datasets:[{data:annual(S.ind,i),borderColor:LINES[0],tension:.2,segment:{borderDash:dash}}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
    const m=new Map();for(const r of D[S.ind])if(r[2]===i&&okR(r,S.ind))m.set(r[3],(m.get(r[3])||0)+r[6]);
    hbar('pc2',[...m].sort((a,c)=>c[1]-a[1]).slice(0,5).map(([k,v])=>[cap(D.dims.esp[k]),v]),'TM',v=>nf(v)+' TM')}
}
function renderMarket(){
  const E=D.exp.filter(r=>okR(r,'exp')),fob=E.reduce((a,r)=>a+r[8],0),tmb=E.reduce((a,r)=>a+r[7],0),vt=[...byDep('ven').values()].reduce((a,b)=>a+b,0);
  $('#kpis').innerHTML=[['Exportación FOB','US$ '+nf(fob/1e6,1)+' M','valor FOB · SUNAT'],['Exportación','TMB '+nf(tmb),'toneladas métricas brutas'],['FOB / TMB implícito',tmb?'US$ '+nf(fob/tmb)+'/TMB':'s/d','cociente, no precio de mercado'],['Venta interna',nf(vt)+' TM','TM, no comparable con TMB']].map(x=>`<div class="kpi"><small>${x[0]}</small><b>${x[1]}</b><span>${x[2]}</span></div>`).join('');
  $('#cards').innerHTML=card('c1','Exportaciones FOB por año','US$ millones · 2026* = ene–ago (parcial)')+card('c2','Exportaciones por continente de destino','FOB US$ millones · filtros activos')+card('c3','Principales países de destino (top 10)','FOB US$ millones · filtros activos')+card('c4','Venta interna por año','TM · 2026* = ene–ago (parcial)');
  const ya={};for(const r of D.exp)if(okR(r,'exp','y'))ya[r[0]]=(ya[r[0]]||0)+r[8]/1e6;
  chart('c1',{type:'bar',data:{labels:YEARS.map(y=>y==LASTY?y+'*':y),datasets:[{data:YEARS.map(y=>ya[y]??null),backgroundColor:YEARS.map(y=>y==LASTY?'#a6d8cc':'#0b5c5c')}]},options:{plugins:{legend:{display:false}}}});
  const agg=(col)=>{const m=new Map();for(const r of E)m.set(r[col],(m.get(r[col])||0)+r[8]/1e6);return[...m].sort((a,b)=>b[1]-a[1])};
  hbar('c2',agg(6).map(([i,v])=>[cap(D.dims.cont[i]),v]),'FOB',v=>'US$ '+nf(v,1)+' M');
  hbar('c3',agg(5).slice(0,10).map(([i,v])=>[cap(D.dims.pais[i]),v]),'FOB',v=>'US$ '+nf(v,1)+' M');
  chart('c4',{type:'line',data:{labels:YEARS.map(y=>y==LASTY?y+'*':y),datasets:[{data:annual('ven'),borderColor:'#c2410c',tension:.2,segment:{borderDash:dash}}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>nf(v)}}}}});
}
function renderFoot(){
  const src={mapa:'Fuente: Observatorio Producempresarial (archivo Acuicultura.xlsx). Cosecha y producción: empresas acuícolas. Venta interna: DIREPRO y empresas acuícolas. Cifras 2026 preliminares (enero–agosto).',mercado:'Fuente: exportaciones, SUNAT; venta interna, DIREPRO y empresas acuícolas. FOB en US$; TMB = toneladas métricas brutas. Las exportaciones no tienen departamento de origen en la data, por eso no se mapean. Cifras 2026 preliminares (enero–agosto).',derechos:'Fuente: Catastro Acuícola de PRODUCE (cortes 05.02.2026 y 22.10.2026) y Dirección General de Acuicultura (2024, sin fecha de corte). El título de la hoja 2026 dice «a agosto» pero indica fecha de corte 22.10.26.'};
  $('#foot').innerHTML=`<p>${src[S.tab]}</p><p>Datos procesados el ${D.meta.generado}. Los filtros recalculan totales y rankings. «Sin dato» = sin registros en el Excel; no se interpreta como cero. Las asociaciones mostradas no implican causalidad. Más detalle en el README.</p>`;
}
render();
})();
